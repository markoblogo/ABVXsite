name: Sync project descriptions

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional project slug to sync
        required: false
        type: string
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  observe-project-events:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.observe.outputs.has_changes }}
      target_slugs: ${{ steps.observe.outputs.target_slugs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Observe allowlisted project repository commits
        id: observe
        env:
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: node scripts/cortex-abv-observe-project-events.mjs --output "$RUNNER_TEMP/cortex-abv-observed-events.json" ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Save read-only evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-abv-observed-events
          path: ${{ runner.temp }}/cortex-abv-observed-events.json
          if-no-files-found: error

  apply-autonomous-public-updates:
    needs: observe-project-events
    if: needs.observe-project-events.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:sync

      - name: Download observed evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-abv-observed-events
          path: ${{ runner.temp }}/cortex-abv

      - name: Show observed evidence targets
        env:
          TARGET_SLUGS: ${{ needs.observe-project-events.outputs.target_slugs }}
        run: echo "CortexABV observed changed sources for $TARGET_SLUGS"

      - name: Prepare bounded content updates from project repositories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
          TARGET_SLUGS: ${{ needs.observe-project-events.outputs.target_slugs }}
        run: |
          mkdir -p "$RUNNER_TEMP/cortex-abv-copy-proposals"
          for slug in $TARGET_SLUGS; do
            node scripts/sync-project-descriptions.mjs --slug "$slug" --autonomous-only --evidence-dir "$RUNNER_TEMP/cortex-abv-copy-proposals"
          done

      - name: Validate proposed content
        run: npm run content:validate

      - name: Apply validated bounded update to main
        id: apply
        run: |
          previous_commit="$(git rev-parse HEAD)"
          echo "previous_commit=$previous_commit" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- content/work; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cortex-abv[bot]"
          git config user.email "cortex-abv[bot]@users.noreply.github.com"
          git add content/work
          git commit -m "chore: refresh bounded public project copy"
          applied_commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "applied_commit=$applied_commit" >> "$GITHUB_OUTPUT"

      - name: Write CortexABV autonomous evidence receipt
        if: steps.apply.outputs.applied == 'true'
        run: node scripts/cortex-abv-write-autonomous-apply-receipt.mjs --input "$RUNNER_TEMP/cortex-abv/cortex-abv-observed-events.json" --claims-dir "$RUNNER_TEMP/cortex-abv-copy-proposals" --output "$RUNNER_TEMP/cortex-abv-autonomous-public-sync-receipt.json" --target-repository "${{ github.repository }}" --target-branch main --previous-commit "${{ steps.apply.outputs.previous_commit }}" --applied-commit "${{ steps.apply.outputs.applied_commit }}"

      - name: Save autonomous evidence receipt
        if: steps.apply.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-abv-autonomous-public-sync-receipt
          path: ${{ runner.temp }}/cortex-abv-autonomous-public-sync-receipt.json
          if-no-files-found: error

  check-lab-repo-token:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          LAB_REPO_TOKEN: ${{ secrets.LAB_REPO_TOKEN }}
        run: |
          if [ -n "$LAB_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  refresh-lab-home-ledger:
    needs: check-lab-repo-token
    if: needs.check-lab-repo-token.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Lab with its separately scoped write token
        uses: actions/checkout@v4
        with:
          repository: markoblogo/lab.abvx
          token: ${{ secrets.LAB_REPO_TOKEN }}
          path: lab-abvx

      - name: Rebuild Lab home freshness ledger from allowlisted source SHAs
        working-directory: lab-abvx
        env:
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: |
          python3 scripts/sync_home_ledger.py
          git diff --check

      - name: Commit bounded Lab freshness update
        id: apply-lab
        working-directory: lab-abvx
        run: |
          if git diff --quiet -- docs/index.html docs/assets/home-ledger-snapshot.v1.json; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cortex-abv[bot]"
          git config user.email "cortex-abv[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/home-ledger-snapshot.v1.json
          git commit -m "chore: refresh home ledger provenance"
          git push origin HEAD:main
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Save Lab ledger evidence snapshot
        if: steps.apply-lab.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-abv-lab-home-ledger-snapshot
          path: lab-abvx/docs/assets/home-ledger-snapshot.v1.json
          if-no-files-found: error
