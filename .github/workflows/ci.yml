name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify application build
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/deployment-scope.mjs --ci >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run content:validate
      - run: npm run ecosystem:check
      - run: npm run lint
        if: steps.scope.outputs.publication != 'true'
      - run: npm run test:sync
        if: steps.scope.outputs.publication != 'true'
      - run: npm run test:publication
        if: steps.scope.outputs.publication == 'true'
      - run: npm run cortex-abv:vector-export:check
        if: steps.scope.outputs.publication != 'true'
      - run: npm run build
        if: steps.scope.outputs.build != 'false' && steps.scope.outputs.publication != 'true'
      - run: npm run prebuild
        if: steps.scope.outputs.publication == 'true'
      - name: Enforce the publication data boundary
        if: steps.scope.outputs.publication == 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run content:publication-boundary -- --base "$CI_BASE_SHA"
      - name: Check committed publication discovery outputs
        if: steps.scope.outputs.publication == 'true'
        run: git diff --exit-code -- content/writing-discovery.json content/catalogue-discovery.json public/content-index.json public/llms.txt
      - run: git diff --exit-code -- content/catalogue-discovery.json
        if: steps.scope.outputs.build != 'false'
      - run: npm audit --omit=dev --audit-level=high
