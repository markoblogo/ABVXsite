name: Owner review project-copy proposal

on:
  workflow_dispatch:
    inputs:
      proposal_ref:
        description: Branch or ref that contains the pending review artifact
        required: true
        type: string
      review_artifact_path:
        description: Path to the pending CortexABVWriteExecutorReviewArtifact JSON in that ref
        required: true
        type: string
      owner_review_status:
        description: Owner review decision
        required: true
        type: choice
        options:
          - approved
          - rejected
      owner_decision:
        description: Short owner decision note
        required: true
        type: string

permissions:
  contents: write

jobs:
  owner-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.proposal_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:sync

      - name: Apply owner review decision and optional wiring plan
        env:
          REVIEW_ARTIFACT_PATH: ${{ inputs.review_artifact_path }}
          OWNER_REVIEW_STATUS: ${{ inputs.owner_review_status }}
          OWNER_DECISION: ${{ inputs.owner_decision }}
        run: |
          BASENAME="$(basename "$REVIEW_ARTIFACT_PATH" .json)"
          REVIEWED_PATH="cortex-abv/reviews/decisions/${BASENAME}.${OWNER_REVIEW_STATUS}.json"
          PLAN_PATH="cortex-abv/reviews/plans/${BASENAME}.executor-plan.json"

          if [ "$OWNER_REVIEW_STATUS" = "approved" ]; then
            node scripts/cortex-abv-owner-review-decision.mjs \
              --input "$REVIEW_ARTIFACT_PATH" \
              --status "$OWNER_REVIEW_STATUS" \
              --owner-decision "$OWNER_DECISION" \
              --output "$REVIEWED_PATH" \
              --plan-output "$PLAN_PATH"
          else
            node scripts/cortex-abv-owner-review-decision.mjs \
              --input "$REVIEW_ARTIFACT_PATH" \
              --status "$OWNER_REVIEW_STATUS" \
              --owner-decision "$OWNER_DECISION" \
              --output "$REVIEWED_PATH"
          fi

          git config user.name "cortex-abv[bot]"
          git config user.email "cortex-abv[bot]@users.noreply.github.com"
          git add "$REVIEWED_PATH"
          if [ -f "$PLAN_PATH" ]; then
            git add "$PLAN_PATH"
          fi
          git commit -m "chore: record CortexABV owner review decision"
          git push origin HEAD

      - name: Save owner review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-abv-owner-review
          path: |
            cortex-abv/reviews/decisions
            cortex-abv/reviews/plans
          if-no-files-found: error
