name: Sync project descriptions

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional project slug to sync
        required: false
        type: string
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  observe-project-events:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.observe.outputs.has_changes }}
      target_slugs: ${{ steps.observe.outputs.target_slugs }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Observe allowlisted project repository commits
        id: observe
        env:
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: node scripts/cortex-abv-observe-project-events.mjs --output "$RUNNER_TEMP/cortex-abv-observed-events.json" ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Save read-only evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: cortex-abv-observed-events
          path: ${{ runner.temp }}/cortex-abv-observed-events.json
          if-no-files-found: error

  prepare-owner-review-public-updates:
    needs: observe-project-events
    if: needs.observe-project-events.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:sync

      - name: Download observed evidence artifact
        uses: actions/download-artifact@v8
        with:
          name: cortex-abv-observed-events
          path: ${{ runner.temp }}/cortex-abv

      - name: Show observed evidence targets
        env:
          TARGET_SLUGS: ${{ needs.observe-project-events.outputs.target_slugs }}
        run: echo "CortexABV observed changed sources for $TARGET_SLUGS"

      - name: Prepare bounded content updates from project repositories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
          TARGET_SLUGS: ${{ needs.observe-project-events.outputs.target_slugs }}
        run: |
          mkdir -p "$RUNNER_TEMP/cortex-abv-copy-proposals"
          for slug in $TARGET_SLUGS; do
            node scripts/sync-project-descriptions.mjs --slug "$slug" --autonomous-only --evidence-dir "$RUNNER_TEMP/cortex-abv-copy-proposals"
          done

      - name: Validate proposed content
        run: npm run content:validate

      - name: Build owner-review PR for bounded content updates
        id: apply
        env:
          TARGET_SLUGS: ${{ needs.observe-project-events.outputs.target_slugs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/work; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "No change proposed for this observed source set."
            exit 0
          fi

          BRANCH="cortexabv/write-side-${GITHUB_RUN_ID}"
          REVIEW_SLUG="$(printf '%s' "$TARGET_SLUGS" | tr ' ' '-')"
          REVIEW_ARTIFACT_PATH="cortex-abv/reviews/pending/${REVIEW_SLUG}.write-review.v1.json"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "review_artifact_path=$REVIEW_ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          git config user.name "cortex-abv[bot]"
          git config user.email "cortex-abv[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          node scripts/cortex-abv-render-pr-receipt.mjs \
            --input "$RUNNER_TEMP/cortex-abv/cortex-abv-observed-events.json" \
            --claims-dir "$RUNNER_TEMP/cortex-abv-copy-proposals" \
            --output "$RUNNER_TEMP/cortex-abv-autonomous-public-sync-receipt.md"

          mkdir -p "$(dirname "$REVIEW_ARTIFACT_PATH")"
          node scripts/cortex-abv-write-side-review-artifact.mjs \
            --input "$RUNNER_TEMP/cortex-abv/cortex-abv-observed-events.json" \
            --claims-dir "$RUNNER_TEMP/cortex-abv-copy-proposals" \
            --output "$REVIEW_ARTIFACT_PATH"

          {
            printf '%s\n' \
              '## CortexABV write-side executor (owner review)' \
              '' \
              'Status: `pending_review`' \
              '' \
              'Owner decision:' \
              '- [ ] set `ownerReview.status = approved` and merge this PR' \
              '- [ ] set `ownerReview.status = rejected` and close with a reason' \
              '' \
              'Pending review artifact path:' \
              "- \`$REVIEW_ARTIFACT_PATH\`" \
              '' \
              'Manual owner-review workflow:' \
              '- Run `Owner review project-copy proposal` against this PR branch, choose `approved` or `rejected`, and provide a short owner decision note.' \
              '' \
              'Merging is the only publication action. This workflow does not auto-publish.' \
              > "$RUNNER_TEMP/cortex-abv-pr-review-body.md"
          }
          cat "$RUNNER_TEMP/cortex-abv-autonomous-public-sync-receipt.md" >> "$RUNNER_TEMP/cortex-abv-pr-review-body.md"
          git add content/work "$REVIEW_ARTIFACT_PATH"
          git commit -m "chore: propose bounded public project copy updates"
          git push -u origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore: CortexABV bounded project-copy proposal (${TARGET_SLUGS})" \
            --body-file "$RUNNER_TEMP/cortex-abv-pr-review-body.md" \
            --head "$BRANCH" \
            --base main
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Save write-side executor evidence artifacts
        if: steps.apply.outputs.applied == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cortex-abv-write-side-executor
          path: |
            ${{ runner.temp }}/cortex-abv-autonomous-public-sync-receipt.md
            ${{ runner.temp }}/cortex-abv-pr-review-body.md
            ${{ steps.apply.outputs.review_artifact_path }}
          if-no-files-found: error
