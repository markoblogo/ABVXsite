name: Sync project descriptions

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional project slug to sync
        required: false
        type: string
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-copy-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:sync

      - name: Propose content updates from project repositories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: node scripts/sync-project-descriptions.mjs ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Validate proposed content
        run: npm run content:validate

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/project-description-sync
          delete-branch: true
          title: 'chore: sync project descriptions from source repos'
          commit-message: 'chore: sync project descriptions from source repos'
          body: |
            Proposed copy updates generated only from configured repository documents.

            Review factual claims and tone before merging.
